<html lang="ru">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>СКТО | Разрядный калькулятор</title>
<style>
:root{--red:#e01b24;--red2:#7d0f14;--sil:#c4c9cf;--mut:#8b9097;--line:#2b2e33;--card:#121315;--card2:#1b1c1f}

.sub{color:var(--sil);font-size:14px;margin-top:2px}
.wrap{max-width:720px;margin:0 auto;padding:12px 12px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--sil);margin:10px 0 4px}
label:first-child{margin-top:0}

.seg{display:flex;gap:8px}
.seg button,.tabs button,.chips button{font:inherit;color:var(--sil);background:var(--card2);border:1.5px solid #3a3d43;border-radius:10px;min-height:50px;padding:8px 10px;cursor:pointer}
.seg button{flex:1;font-size:18px;font-weight:600}
.seg button.on,.tabs button.on,.chips button.on{background:var(--red);border-color:var(--red);color:#fff}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tabs button{font-size:15px;font-weight:600}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chips button{font-size:16px;font-weight:600}
.chips button:disabled{opacity:.3}
.big{text-align:center;padding:18px 8px}
.big .n{font-size:44px;font-weight:700;letter-spacing:.5px;color:#fff;font-variant-numeric:tabular-nums}
.big .l{color:var(--sil);font-size:15px}
.big .u{color:var(--mut);font-size:13px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--mut);font-size:12px;text-align:left;padding:4px 6px}
td{padding:11px 6px;border-top:1px solid var(--line);font-size:16px}
td:nth-child(2){font-weight:600;white-space:nowrap}
td:nth-child(3){font-size:13px;color:var(--mut)}
tr.ok td{color:var(--sil)}
tr.ok td:nth-child(3){color:#8fd19a}
tr.best td{background:rgba(224,27,36,.16);color:#fff}
tr.best td:first-child{border-left:4px solid var(--red)}
tr.no td{color:#555}
.res{border:1.5px solid var(--red);background:#150607}
.res .h{font-size:13px;color:var(--sil)}
.res .v{font-size:30px;font-weight:700;margin:2px 0}
.warn{color:#ffb4b7;font-size:14px;margin-top:8px}
.note{color:var(--sil);font-size:13.5px;margin-top:8px}
.dis{border-left:3px solid var(--sil);padding-left:10px;margin-top:10px;font-size:14px;color:#fff}

.mbtn:active{background:var(--red2)}

.lr .t b{font-size:15px}

.lr .t .cum.e{color:#555;font-weight:400}

<header>
  <h1><b>СКТО</b> | Разрядный калькулятор</h1>
  <div class="sub">Нормативы по конькобежному спорту</div>

  <div class="mtitle">СКТО — Калькулятор разрядов</div>
  <button type="button" class="mbtn" onclick="show('calc')"><b>Калькулятор разрядов</b><span>Введите итоговое время дистанции и узнайте, какой разряд выполнен</span></button>

</div>
<div class="wrap" id="wrapCalc" hidden>
  <div class="card">
    <label>Пол</label>
    <div class="seg" id="seg"></div>

  <div id="view"></div>

/* ===== Время и очки ===== */
function pT(s){s=String(s).trim().replace(",",".");const m=s.match(/^(?:(\d{1,2}):)?(\d{1,3})(?:\.(\d{1,2}))?$/);if(!m)return NaN;const ss=+m[2];if(m[1]&&ss>=60)return NaN;const d=m[3]?+((m[3]+"0").slice(0,2)):0;return((m[1]?+m[1]:0)*60+ss)*100+d}
function fT(v){const m=Math.floor(v/6000),r=v%6000,s=Math.floor(r/100),h=r%100;return(m?m+":"+String(s).padStart(2,"0"):String(s))+","+String(h).padStart(2,"0")}
function fP(v){let s=(v/1000).toFixed(3);if(v%10===0)s=s.slice(0,-1);return s.replace(".",",")}
function F(v,k){return k==="p"?fP(v):fT(v)}
function fD(d,k){return k==="p"?fP(d)+" оч.":(d/100).toFixed(2).replace(".",",")+" с"}
const DB={};
for(const c in RAW){DB[c]={};for(const id in RAW[c]){const k=N[id][1],t=RAW[c][id].split(/\s+/);while(t.length<18)t.push("-");
 DB[c][id]=t.map(x=>{if(x==="-")return null;let f=0;if(x.endsWith("?")){f=1;x=x.slice(0,-1)}return{v:k==="p"?Math.round(parseFloat(x)*1000):pT(x),f}})}}

function evalX(x,id,cat,g){
 cat=cat||S.cat;g=g===undefined?S.g:g;
 const k=N[id][1],r=LV.map((n,i)=>({i,c:norm(cat,id,g,i)}));
 const ok=r.filter(o=>o.c&&!o.c.f);
 let best=null;for(const o of r){if(o.c&&!o.c.f&&x<=o.c.v){best=o;break}}
 let next=null;
 if(best){for(let i=best.i-1;i>=0;i--){const o=r[i];if(o.c&&!o.c.f){next=o;break}}}
 else if(ok.length)next=ok[ok.length-1];
 return{r,best,next,k,ok}}

function tableHTML(id,x){
 const k=N[id][1];let h="<table><tr><th>Разряд</th><th>Норма (не более)</th><th>"+(x!=null?"Ваш результат":"")+"</th></tr>";
 const e=x!=null?evalX(x,id):null;
 for(let i=0;i<9;i++){const c=norm(S.cat,id,S.g,i);let cls="",a="",b="";
  if(!c){cls="no";a="—";b="нет нормы"}
  else if(c.f){a=F(c.v,k)+" ⚠";b="неподтверждён"}
  else{a=F(c.v,k);if(e){if(x<=c.v){cls=(e.best&&e.best.i===i)?"best":"ok";b="запас "+fD(c.v-x,k)}else b="не хватает "+fD(x-c.v,k)}}
  h+="<tr class='"+cls+"'><td>"+LV[i]+"</td><td>"+a+"</td><td>"+b+"</td></tr>"}
 return h+"</table>"}

 if(i<=1)L.push("Результат фиксируется электронным секундомером (до 0,01 с) или электронным автохронометражем (п. 3).");

 if(TEAM.includes(id))L.push("Командные забеги и эстафеты: норма засчитывается тем, кто бежал в забеге, где она выполнена; за забег присваивается только очередное звание или разряд (п. 7–8).");

 return"<ul>"+L.map(s=>"<li>"+s+"</li>").join("")+"</ul>"}

function calc(){
 const id=S.id,k=N[id][1],r=$("res");if(!r)return;
 if(!has(S.cat,id,S.g)){r.innerHTML=noNorm();return}
 if(!S.x.trim()){r.innerHTML="<div class='card'>Введите результат — норматив определится сразу.</div>"+"<div class='card'>"+tableHTML(id,null)+"</div>";return}
 let x;
 if(k==="p"){x=Math.round(parseFloat(S.x.replace(",","."))*1000);if(!isFinite(x)||x<=0){r.innerHTML="<div class='card warn'>Введите число, например 171.105</div>";return}}
 else{if(/[.,]\d{3,}/.test(S.x)){r.innerHTML="<div class='card warn'>Точность — до сотых секунды: не больше двух знаков после запятой.</div>";return}
  x=pT(S.x);if(isNaN(x)||x<=0){r.innerHTML="<div class='card warn'>Не удалось разобрать время. Примеры: 40.52, 1:21.35, 2:15.60.</div>";return}}
 const e=evalX(x,id),age=parseInt(S.age,10);let h="<div class='card res'>";
 if(e.best){const i=e.best.i;h+="<div class='h'>Результат "+F(x,k)+" соответствует нормативу</div><div class='v'>"+LVF[i]+"</div><div class='h'>норма: не более "+F(e.best.c.v,k)+"</div>";
  if(e.next)h+="<div class='note'>До «"+LV[e.next.i]+"» ("+F(e.next.c.v,k)+") не хватает <b>"+fD(x-e.next.c.v,k)+"</b></div>";
  else h+="<div class='note'>Это наивысший норматив для дисциплины.</div>";
  if(!isNaN(age)&&age<AGE[i])h+="<div class='warn'>Возраст "+age+" — меньше минимального для этого разряда ("+AGE[i]+" лет).</div>"}
 else{h+="<div class='h'>Результат "+F(x,k)+"</div><div class='v'>Норматив не выполнен</div>";
  if(e.next)h+="<div class='note'>До «"+LV[e.next.i]+"» ("+F(e.next.c.v,k)+") не хватает <b>"+fD(x-e.next.c.v,k)+"</b></div>"}
 if(!isNaN(age)){const a=e.r.filter(o=>o.c&&!o.c.f&&x<=o.c.v&&age>=AGE[o.i]);if(e.best&&a.length&&a[0].i!==e.best.i)h+="<div class='warn'>По возрасту ("+age+") доступен разряд не выше «"+LV[a[0].i]+"».</div>"}
 if(e.r.some(o=>o.c&&o.c.f))h+="<div class='warn'>⚠ Неподтверждённые значения в расчёте не участвуют.</div>";
 h+=DISC+"</div><div class='card'>"+tableHTML(id,x)+"</div>";
 if(e.best)h+="<div class='card'><div style='font-weight:600'>Условия: "+LV[e.best.i]+"</div>"+condHTML(e.best.i,id)+"</div>";
 r.innerHTML=h}

function mview(){
 const L=mlist();
 if(!L.length){$("view").innerHTML="<div class='card'>Для этой категории катка многоборий в таблице нет.</div>";return}
 if(!L.includes(S.mid))S.mid=L.includes(S.id)?S.id:L[0];

 let h="<div class='card'><label for='mid'>Многоборье</label><select id='mid'>"+L.map(i=>"<option value='"+i+"'"+(i===S.mid?" selected":"")+">"+N[i][0]+"</option>").join("")+"</select>";
 if(!comps)h+="<div class='warn'>Для 100 и 300 м формула очков в п. 9 приложения не указана — расчёт недоступен. Нормы смотрите во вкладках «Узнать норматив» и «Проверить результат».</div></div>";
 else{h+="<div class='note'>Очки = время (с) ÷ коэффициент: 500 м — 1 с, 777 м — 1,55 с, 1000 м — 2 с, 1500 м — 3 с, 3000 м — 6 с, 5000 м — 10 с, 10 000 м — 20 с.</div>";
  h+=comps.map((d,j)=>"<label for='p"+j+"'>Дистанция "+(j+1)+": "+d+" м</label><input id='p"+j+"' type='text' autocomplete='off' placeholder='40.52 или 1:21.35' value='"+(S.pt[j]||"")+"'>").join("")+"</div><div id='pres'></div>"}
 $("view").innerHTML=h;
 $("mid").onchange=e=>{S.mid=e.target.value;S.id=S.mid;S.pt=["","","",""];save();head();mview()};
 if(comps){comps.forEach((d,j)=>{$("p"+j).oninput=e=>{S.pt[j]=e.target.value;pcalc()}});pcalc()}}
function pcalc(){
 const comps=N[S.mid][2],out=$("pres");let sum=0;
 for(let j=0;j<comps.length;j++){const t=pT(S.pt[j]);if(!S.pt[j].trim()||isNaN(t)||t<=0){out.innerHTML="<div class='card'>Заполните времена на всех дистанциях.</div>";return}sum+=t*10/FAC[comps[j]]}
 const x=Math.floor(sum+1e-6),id=S.mid,sv=S.id;S.id=id;
 let h="<div class='card res'><div class='h'>Сумма очков</div><div class='v'>"+(x/1000).toFixed(3).replace(".",",")+"</div><div class='note'>Сумма усечена до трёх знаков; способ округления в тексте приложения не уточнён.</div>";
 if(has(S.cat,id,S.g)){const e=evalX(x,id);
  h+=e.best?"<div class='note'>Соответствует нормативу: <b>"+LVF[e.best.i]+"</b>"+(e.next?". До «"+LV[e.next.i]+"» не хватает "+fD(x-e.next.c.v,"p"):"")+"</div>":"<div class='note'>Норматив не выполнен"+(e.next?". До «"+LV[e.next.i]+"» не хватает "+fD(x-e.next.c.v,"p"):"")+"</div>";
  h+=DISC+"</div><div class='card'>"+tableHTML(id,x)+"</div>"}
 else h+="<div class='warn'>Для этого пола в этом многоборье нормативов нет — смените пол.</div></div>";
 out.innerHTML=h}

 const sg=lapSegs(L.d);L.v=sg.map(()=>["","","",""]);
 $("lrows").innerHTML=sg.map((o,i)=>"<div class='lr'><div class='t'><b>"+o.n+"</b><span class='cum e' id='c"+i+"'>—</span></div>"+
  "<div class='tf' data-i='"+i+"'><input data-f='0' inputmode='numeric' pattern='[0-9]*' maxlength='2' autocomplete='off' placeholder='мм' aria-label='минуты'><i>:</i><input data-f='1' inputmode='numeric' pattern='[0-9]*' maxlength='2' autocomplete='off' placeholder='сс' aria-label='секунды'><i>,</i><input class='d' data-f='2' inputmode='numeric' pattern='[0-9]*' maxlength='1' autocomplete='off' placeholder='д' aria-label='десятые'><input class='d' data-f='3' inputmode='numeric' pattern='[0-9]*' maxlength='1' autocomplete='off' placeholder='с' aria-label='сотые'><span class='u'>"+o.u+"</span></div></div>").join("");
 $("lrows").oninput=lapsIn;
 lapsCalc()}
function lapsIn(e){
 const el=e.target;if(el.tagName!=="INPUT")return;
 const row=el.parentNode,i=+row.dataset.i,f=+el.dataset.f;
 let v=el.value.replace(/\D/g,"").slice(0,f<2?2:1);
 if(f===1&&v!==""&&+v>59)v=v.slice(0,-1);
 el.value=v;L.v[i][f]=v;
 const inp=row.querySelectorAll("input");
 if((f===0||f===1)&&v.length===2)inp[f+1].focus();
 else if(f===2&&v.length===1)inp[3].focus();
 else if(f===3&&v.length===1&&i<L.v.length-1){const nx=$("lrows").querySelectorAll(".tf")[i+1];if(nx)nx.querySelectorAll("input")[1].focus()}
 lapsCalc()}
function segVal(a){if(a[1]===""||a[2]===""||a[3]==="")return null;return((a[0]===""?0:+a[0])*60+ +a[1])*100+ +a[2]*10+ +a[3]}
function lapsCalc(){
 const n=L.v.length;let k=0,cum=0,first=-1,any=0;
 for(let i=0;i<n;i++){if(segVal(L.v[i])!==null)any++}
 for(;k<n;k++){const t=segVal(L.v[k]);if(t===null)break;cum+=t;const c=$("c"+k);c.textContent=fT(cum);c.className="cum"}
 for(let i=k;i<n;i++){const c=$("c"+i);c.textContent="—";c.className="cum e"}
 $("acc").textContent=k?"Накоплено: "+fT(cum):"";
 const r=$("lres"),id="d"+L.d,sg=lapSegs(L.d);
 if(k<n){
  let h="<div class='card'><div class='note' style='margin:0'>Итог появится, когда будут заполнены все отрезки ("+k+" из "+n+").";
  if(any>k)h+=" Отрезок «"+sg[k].n+"» пропущен — последующие значения в накопленное время не входят.";
  r.innerHTML=h+"</div></div>";return}
 const e=evalX(cum,id,L.cat,L.g);let h="<div class='card res'><div class='h'>Итоговое время · "+(L.d===10000?"10 000":L.d)+" м</div><div class='tot'>"+fT(cum)+"</div>";
 if(!has(L.cat,id,L.g))h+="<div class='warn'>Для выбранного пола и категории катка норматив по этой дистанции в ЕВСК не установлен — разряд не определяется.</div>";
 else if(e.best){h+="<div class='h' style='margin-top:8px'>Выполненный разряд</div><div class='v'>"+LVF[e.best.i]+"</div><div class='h'>норма: не более "+fT(e.best.c.v)+"</div>";
  h+=e.next?"<div class='note'>До «"+LV[e.next.i]+"» ("+fT(e.next.c.v)+") не хватает <b>"+fD(cum-e.next.c.v,"t")+"</b></div>":"<div class='note'>Это наивысший норматив для дистанции.</div>"}
 else{h+="<div class='v' style='margin-top:8px'>Норматив не выполнен</div>";if(e.next)h+="<div class='note'>До «"+LV[e.next.i]+"» ("+fT(e.next.c.v)+") не хватает <b>"+fD(cum-e.next.c.v,"t")+"</b></div>"}
 if(e.r.some(o=>o.c&&o.c.f))h+="<div class='warn'>⚠ Неподтверждённые значения в расчёте не участвуют.</div>";
 r.innerHTML=h+DISC+"</div>"}

head();view();
</script>
